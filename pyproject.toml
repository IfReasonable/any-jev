[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hf-decider"
version = "0.1.0"
description = "Exact continuation scoring and probabilistic decisions for Hugging Face causal LMs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "HF-Decider contributors"}]
dependencies = ["torch>=2.4", "transformers>=5.15,<6"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "build>=1.2", "twine>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: downloads a tiny model from Hugging Face Hub"]

[tool.ruff]
target-version = "py310"
line-length = 100
