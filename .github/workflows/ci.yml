name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
        transformers-version: ['>=5.15,<5.16', '>=5.17,<6']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,vision]'
      - run: python -m pip install 'transformers${{ matrix.transformers-version }}'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q -m 'not integration'
      - run: python -m build
      - run: twine check dist/*
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,vision]'
      - run: pytest -q -m integration
